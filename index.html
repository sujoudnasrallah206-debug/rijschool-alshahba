ن. كل امتحان ينفتح بصفحته مباشرة.'],nl:['Examen ','Open examen','Afbeelding links, vraag en antwoorden rechts. Elk examen opent op een eigen pagina.'],en:['Exam ','Open exam','Image on the left; question and answers on the right. Each exam opens in its own page.']};let lang=new URLSearchParams(location.search).get('lang')||'ar';if(!txt[lang])lang='ar';function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';for(let k of Object.keys(txt))document.getElementById(k).classList.toggle('active',k===l);document.getElementById('grid').replaceChildren();const files=['exam1.html','exam2.html','exam3.html','exam4.html','exam5.html','exam6.html','exam7.html'];for(let i=1;i<=7;i++){let c=document.createElement('article');c.className='card';let h=document.createElement('h2');h.textContent=txt[l][0]+i;let a=document.createElement('a');a.href=files[i-1]+'?lang='+l;a.textContent=txt[l][1];c.append(h,a);document.getElementById('grid').append(c)}document.getElementById('hint').textContent=txt[l][2]}setLang(lang);</script></body></html>
